}
const activeCount = () => [S.g || S.c, S.ing, S.min != null || S.max != null].filter(Boolean).length + S.forms.length;
function clearAll() { S.g = S.c = S.ing = ""; S.forms = []; S.min = S.max = null; update(); }

function chipsRow() {
  const t = L(), out = [];
  const chip = (kind, label, off) => el("button", { type: "button", class: "chip", "aria-label": `${t.remove}: ${label}`, onclick: off },
    el("b", { text: kind + ":" }), label, el("span", { class: "x", "aria-hidden": "true", text: "×" }));
  if (S.g) out.push(chip(t.fCat, groupName(S.g), () => { S.g = ""; update(); }));
  if (S.c) out.push(chip(t.fCat, catName(S.c), () => { S.c = ""; update(); }));
  if (S.ing) out.push(chip(t.fIng, S.ing, () => { S.ing = ""; update(); }));
  for (const f of S.forms) out.push(chip(t.fForm, formName(f), () => { S.forms = S.forms.filter(x => x !== f); update(); }));
  if (S.min != null || S.max != null)
    out.push(chip(t.fPrice, `${S.min != null ? money(S.min) : sym() + "0"} – ${S.max != null ? money(S.max) : "∞"}`, () => { S.min = S.max = null; update(); }));
  if (out.length > 1) out.push(el("button", { type: "button", class: "link", text: t.clearAll, onclick: clearAll }));
  return out;
}

/* ---------- results ---------- */
function card(r) {
  const t = L();
  const priceBox = el("div", { class: "price" });
  if (r.p == null) priceBox.append(el("b", { text: t.quote }));
  else {
    priceBox.append(el("b", { text: money(r.p) }), el("small", { text: t.per(r.u) }));
    if (S.cur !== "inr") priceBox.append(el("small", { text: money(r.p, "inr") }));
    if (r.pp != null && r.pp !== r.p) priceBox.append(el("small", { class: "chg " + (r.p > r.pp ? "up" : "down"), text: `${t.was} ${money(r.pp)}` }));
  }
  const line1 = [r.s, r.k].filter(Boolean).join(" · ");
  const line2 = [r.b && !fold(r.n).includes(fold(r.b)) ? r.b : "", r.m, formName(r.f)].filter(Boolean).join(" · ");
  const tags = el("div", { class: "tags" },
    ...r.x.map(x => el("button", { type: "button", class: "tag ing", title: `${t.ing}: ${x}`, text: x,
      onclick: () => { S.ing = x; S.q = ""; $("q").value = ""; update(); window.scrollTo({ top: 0 }); } })),
    el("button", { type: "button", class: "tag", title: `${t.cat}: ${catName(r.c)}`, text: catName(r.c),
      onclick: () => { S.c = r.c; S.g = ""; update(); window.scrollTo({ top: 0 }); } }));
  const det = el("details", { class: "more" }, el("summary", { text: t.desc }));
  if (r.d) det.append(el("p", { text: r.d }));
  if (r.a.length) det.append(el("p", { text: `${t.also}: ${r.a.join("; ")}` }));
  det.append(el("p", {}, el("a", { href: r.l, rel: "noopener", target: "_blank", text: t.seller + " ↗" })));
  const h = el("a", { href: r.l, rel: "noopener", target: "_blank" }); h.append(highlight(r.n));
  return el("li", { class: "item" },
    el("img", { src: r.i, alt: "", loading: "lazy", decoding: "async", width: 92, height: 92, referrerpolicy: "no-referrer" }),
    el("div", {}, el("h3", {}, h), line1 ? el("p", { class: "meta", text: line1 }) : "", line2 ? el("p", { class: "meta", text: line2 }) : "", tags, det),
    priceBox);
}

let current = [];
function renderList(reset) {
  const t = L(), list = $("list");
  if (reset) { list.replaceChildren(); shown = PAGE; }
  const from = list.children.length, to = Math.min(shown, current.length);
  const frag = document.createDocumentFragment();
  for (let i = from; i < to; i++) frag.append(card(current[i]));
  list.append(frag);
  const left = current.length - to;
  $("more").hidden = left <= 0; $("more").textContent = t.more(Math.min(PAGE, left));
}
function update(opts = {}) {
  const t = L();
  if (opts.query !== false) runQuery();
  current = results();
  $("count").textContent = t.count(current.length);
  $("chips").replaceChildren(...chipsRow());
  const notes = [];
  for (const [a, b, own] of Q.notes.syn) if (!own) notes.push(t.syn(a, cap1(b)));
  if (Q.notes.fixed.length) notes.push(t.fixed(Q.notes.fixed.join(", ")));
  if (S.ing && current.length) {
    const ps = current.map(r => r.p).filter(p => p != null);
    if (ps.length) notes.push(t.span(current.length, S.ing, money(Math.min(...ps)), money(Math.max(...ps))));
  }
  $("note").textContent = notes.join("  ·  ");
  const empty = $("empty");
  empty.hidden = current.length > 0;
  if (!current.length) empty.replaceChildren(el("p", { text: t.none }), el("p", { text: t.noneTip }),
    activeCount() ? el("button", { type: "button", class: "chip", text: t.clearAll, onclick: clearAll }) : "");
  const sortSel = $("sort");
  sortSel.querySelector('option[value="best"]').disabled = !Q.terms.length;
  sortSel.value = effectiveSort();
  renderList(true);
  const facets = buildFacets();
  if ($("sheet").open) $("sheetBody").replaceChildren(facets); else $("facets").replaceChildren(facets);
  $("openf").textContent = t.filters + (activeCount() ? ` (${activeCount()})` : "");
  $("sheetDone").textContent = t.show(current.length);
  $("qclear").hidden = !S.q;
  writeHash();
}

/* ---------- suggestions ---------- */
let sIdx = -1, sItems = [];
function suggest() {
  const t = L(), box = $("sugg"), q = fold(S.q).trim();
  if (q.length < 2) return closeSugg();
  const has = s => fold(s).includes(" " + q);
  const out = [];
  const syn = SYN[q];
  if (syn && INGS.has(cap1(syn))) out.push({ kind: t.ing, label: `${cap1(syn)} · ${S.q.trim()}`, n: INGS.get(cap1(syn)), act: () => { S.ing = cap1(syn); S.q = ""; } });
  for (const [k, n] of [...INGS.entries()].filter(([k]) => has(k) && !(syn && k === cap1(syn))).sort((a, b) => b[1] - a[1]).slice(0, 4))
    out.push({ kind: t.ing, label: k, n, act: () => { S.ing = k; S.q = ""; } });
  const cats = new Set();
  for (const r of D.rows) if (!cats.has(r.c) && (has(r.c) || fold(D.catTh[r.c] || "").includes(q))) cats.add(r.c);
  for (const c of [...cats].slice(0, 3)) out.push({ kind: t.cat, label: catName(c), n: D.rows.filter(r => r.c === c).length, act: () => { S.c = c; S.g = ""; S.q = ""; } });
  const brands = new Map();
  for (const r of D.rows) if (r.b && has(r.b)) brands.set(r.b, (brands.get(r.b) || 0) + 1);
  for (const [b] of [...brands.entries()].sort((a, b) => b[1] - a[1]).slice(0, 2)) out.push({ kind: t.brand, label: b, act: () => { S.q = b; } });
  const pq = parseQuery(S.q);
  const prods = D.rows.map(r => [r, scoreRow(r, pq.terms)]).filter(([, s]) => s).sort((a, b) => b[1] - a[1]).slice(0, 5);
  for (const [r] of prods) out.push({ kind: t.product, label: r.n, act: () => { S.q = r.n; } });
  sItems = out.slice(0, 10); sIdx = -1;
  if (!sItems.length) return closeSugg();
  box.replaceChildren(...sItems.map((s, i) => el("li", { role: "option", id: "s" + i, "aria-selected": "false",
    onmousedown: e => { e.preventDefault(); pick(i); } }, el("span", { text: s.label }), el("span", { class: "kind", text: s.n ? `${s.kind} · ${s.n}` : s.kind }))));
  box.hidden = false; $("q").setAttribute("aria-expanded", "true");
}
function closeSugg() { $("sugg").hidden = true; $("q").setAttribute("aria-expanded", "false"); $("q").removeAttribute("aria-activedescendant"); sIdx = -1; }
function moveSugg(d) {
  if ($("sugg").hidden || !sItems.length) return;
  sIdx += d;
  if (sIdx >= sItems.length) sIdx = -1; else if (sIdx < -1) sIdx = sItems.length - 1;
  [...$("sugg").children].forEach((li, i) => li.setAttribute("aria-selected", String(i === sIdx)));
  if (sIdx >= 0) { $("q").setAttribute("aria-activedescendant", "s" + sIdx); $("s" + sIdx).scrollIntoView({ block: "nearest" }); }
  else $("q").removeAttribute("aria-activedescendant");
}
function pick(i) { sItems[i].act(); $("q").value = S.q; closeSugg(); update(); }

/* ---------- chrome, address bar ---------- */
function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  for (const k of ["q", "g", "c", "ing", "sort", "cur", "lang"]) if (h.has(k)) S[k] = h.get(k);
  if (h.has("form")) S.forms = h.get("form").split("|").filter(Boolean);
  if (h.has("min")) S.min = parseFloat(h.get("min"));
  if (h.has("max")) S.max = parseFloat(h.get("max"));
  if (!T.en.sorts[S.sort]) S.sort = "best";
  if (!["thb", "inr", "usd"].includes(S.cur)) S.cur = "thb";
  if (!T[S.lang]) S.lang = "en";
}
function writeHash() {
  const h = new URLSearchParams();
  for (const k of ["q", "g", "c", "ing"]) if (S[k]) h.set(k, S[k]);
  if (S.forms.length) h.set("form", S.forms.join("|"));
  if (S.min != null) h.set("min", Math.round(S.min));
  if (S.max != null) h.set("max", Math.round(S.max));
  if (S.sort !== "best") h.set("sort", S.sort);
  h.set("cur", S.cur); h.set("lang", S.lang);
  history.replaceState(null, "", "#" + h.toString());
}
function chrome() {
  const t = L();
  document.documentElement.lang = S.lang;
  document.title = t.title;
  $("title").textContent = t.title;
  $("sub").textContent = t.sub(D.rows.length, fmtDay(D.when));
  $("lq").textContent = t.q; $("q").placeholder = t.q;
  $("qclear").setAttribute("aria-label", t.clear); $("qclear").textContent = "×";
  $("tries").replaceChildren(el("span", { text: t.tries + ":" }),
    ...t.tryWords.map(w => el("button", { type: "button", text: w, onclick: () => { S.q = w; $("q").value = w; update(); } })));
  $("ls").textContent = t.s;
  $("sort").replaceChildren(...Object.entries(t.sorts).map(([v, l]) => el("option", { value: v, text: l })));
  $("langs").setAttribute("aria-label", "Language / ภาษา");
  $("cur").setAttribute("aria-label", S.lang === "th" ? "สกุลเงิน" : "Currency");
  for (const b of $("cur").children) b.setAttribute("aria-pressed", String(b.dataset.v === S.cur));
  for (const b of $("langs").children) b.setAttribute("aria-pressed", String(b.dataset.l === S.lang));
  $("facets").setAttribute("aria-label", t.filters);
  $("sheetTitle").textContent = t.filters; $("sheetClear").textContent = t.clearAll;
  const args = [[fmtDay(D.when), D.host], [D.stated], [], [D.rates]];
  $("foot").replaceChildren(...t.foot.map((f, i) => { const s = f(...args[i]); return s ? el("p", { text: s }) : ""; }),
    el("p", {}, el("a", { href: "newlife-stock.csv", download: "", text: t.csv }), " · ",
      el("a", { href: `https://${D.host}/`, rel: "noopener", target: "_blank", text: D.host })));
}

function init() {
  readHash();
  if (!location.hash.includes("lang=")) S.lang = getS("nl-lang") || ((navigator.language || "").toLowerCase().startsWith("th") ? "th" : "en");
  if (!location.hash.includes("cur=")) S.cur = getS("nl-cur") || S.cur;
  $("q").value = S.q;
  chrome(); update();

  let timer;
  const q = $("q");
  q.addEventListener("input", e => { S.q = e.target.value; suggest(); clearTimeout(timer); timer = setTimeout(update, 160); });
  q.addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { e.preventDefault(); if ($("sugg").hidden) suggest(); moveSugg(1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); moveSugg(-1); }
    else if (e.key === "Enter") { if (sIdx >= 0) { e.preventDefault(); pick(sIdx); } else { closeSugg(); clearTimeout(timer); update(); } }
    else if (e.key === "Escape") { if (!$("sugg").hidden) closeSugg(); else { S.q = ""; q.value = ""; update(); } }
  });
  q.addEventListener("blur", () => setTimeout(closeSugg, 120));
  q.addEventListener("focus", () => { if (S.q) suggest(); });
  $("qclear").addEventListener("click", () => { S.q = ""; q.value = ""; closeSugg(); update(); q.focus(); });
  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement !== q && !/input|select|textarea/i.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); }
  });
  $("sort").addEventListener("change", e => { S.sort = e.target.value; update({ query: false }); });
  $("cur").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; S.cur = b.dataset.v; setS("nl-cur", S.cur); chrome(); update({ query: false }); });
  $("langs").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; S.lang = b.dataset.l; setS("nl-lang", S.lang); chrome(); update({ query: false }); });
  $("more").addEventListener("click", () => { const first = $("list").children.length; shown += PAGE; renderList(false); $("list").children[first]?.querySelector("a")?.focus(); });
  if ("IntersectionObserver" in window)
    new IntersectionObserver(es => { if (es.some(x => x.isIntersecting) && !$("more").hidden) { shown += PAGE; renderList(false); } }, { rootMargin: "800px" }).observe($("more"));
  const sheet = $("sheet");
  $("openf").addEventListener("click", () => { $("sheetBody").replaceChildren(buildFacets()); sheet.showModal(); });
  $("sheetDone").addEventListener("click", () => sheet.close());
  $("sheetClear").addEventListener("click", clearAll);
  sheet.addEventListener("close", () => { $("facets").replaceChildren(buildFacets()); });
}
init();
</script>
</body>
</html>
